<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hollow Knight</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #101018;
    }

    #game {
      width: 100%;
      height: 100%;
      display: block;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 12px;
      color: #fff;
      font: 600 16px system-ui, sans-serif;
      text-align: center;
    }

    progress {
      width: min(320px, 80vw);
      height: 12px;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="loading">
    <span id="message">Loading runtime…</span>
    <progress id="progress" value="0" max="1"></progress>
  </div>

  <script>
    const DATA_PART_SIZE = 2 * 1024 * 1024;
    const DATA_TOTAL_SIZE = 869012889;
    const DATA_PART_COUNT = Math.ceil(DATA_TOTAL_SIZE / DATA_PART_SIZE); // 415

    const buildBase = 'build/';
    const dataBase = buildBase + 'data2m/';

    const canvas = document.getElementById('game');
    const loading = document.getElementById('loading');
    const message = document.getElementById('message');
    const progress = document.getElementById('progress');

    function numberedUrls(base, prefix, count) {
      return Array.from(
        { length: count },
        (_, index) => base + prefix + '.part' + (index + 1)
      );
    }

    function loadScript(url) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = url;
        script.onload = () => {
          script.remove();
          resolve();
        };
        script.onerror = () => {
          script.remove();
          reject(new Error('Could not load ' + url));
        };
        document.head.appendChild(script);
      });
    }

    async function joinParts(urls, type, label) {
      const blobs = [];

      for (let index = 0; index < urls.length; index += 1) {
        message.textContent =
          'Loading ' + label + ' ' + (index + 1) + ' of ' + urls.length + '…';

        const response = await fetch(urls[index], { cache: 'force-cache' });
        if (!response.ok) {
          throw new Error(
            'Could not load ' + urls[index] + ' (' + response.status + ')'
          );
        }
        blobs.push(await response.blob());
      }

      const objectUrl = URL.createObjectURL(new Blob(blobs, { type }));
      blobs.length = 0;
      return objectUrl;
    }

    function updateMountProgress(update) {
      if (update.phase === 'mounting') {
        message.textContent =
          'Registering data: ' +
          update.filesMounted + ' / ' + update.totalFiles + ' files…';
      } else if (update.phase === 'complete') {
        message.textContent = 'Starting game…';
      }
    }

    let codeUrl = null;

    function revokeRuntimeUrl() {
      if (!codeUrl) return;
      URL.revokeObjectURL(codeUrl);
      codeUrl = null;
    }

    async function startGame() {
      try {
        // Keep small executable JS live with @main. Heavy WASM/data stay cacheable.
        const live = Date.now();
        await loadScript(buildBase + 'hk.stabilityfs.js?live=' + live);
        await loadScript(buildBase + 'hk.loader.js?live=' + live);

        codeUrl = await joinParts(
          numberedUrls(buildBase, 'hk.wasm', 2),
          'application/wasm',
          'runtime'
        );

        message.textContent = 'Starting game…';

        const unityConfig = {
          frameworkUrl: buildBase + 'hk.framework.js?live=' + live,
          codeUrl,
          dataPartUrls: numberedUrls(dataBase, 'hk.data', DATA_PART_COUNT),
          mountDataParts: (module, urls) =>
            mountUnityDataParts(module, urls, {
              partSize: DATA_PART_SIZE,
              totalSize: DATA_TOTAL_SIZE,
              onProgress: updateMountProgress
            })
        };

        const instance = await createUnityInstance(
          canvas,
          unityConfig,
          value => { progress.value = value; }
        );

        // Deliberately exposed for independent diagnostics/bookmarklets.
        window.__hkUnityInstance = instance;

        installHollowKnightPersistence(instance.Module);
        installHollowKnightKeyboardBridge(canvas);

        revokeRuntimeUrl();
        loading.remove();
      } catch (error) {
        revokeRuntimeUrl();
        console.error(error);
        message.textContent =
          'Unable to start: ' +
          (error && error.message ? error.message : String(error));
      }
    }

    startGame();
  </script>
</body>
</html>
