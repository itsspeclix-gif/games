<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hollow Knight</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #101018;
    }

    #game {
      width: 100%;
      height: 100%;
      display: block;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 12px;
      color: #fff;
      font: 600 16px system-ui, sans-serif;
      text-align: center;
    }

    progress {
      width: min(320px, 80vw);
      height: 12px;
    }

    #data-progress,
    #retry-status,
    #build-version {
      font: 500 12px/1.35 system-ui, sans-serif;
      opacity: 0.78;
    }

    #retry-status {
      min-height: 1.35em;
      opacity: 0.95;
    }

    #build-version {
      margin-top: 2px;
      font-weight: 700;
      opacity: 0.92;
    }


    #loading[hidden], #launch-settings[hidden] { display: none; }
    #launch-settings { position: fixed; z-index: 20; left: 50%; top: 50%; transform: translate(-50%, -50%); box-sizing: border-box; width: calc(100vw - 32px); max-width: 380px; max-height: calc(100vh - 32px); overflow: auto; padding: 24px; border: 1px solid #555; border-radius: 8px; background: #181820; color: #eee; font: 14px/1.4 system-ui, sans-serif; text-align: left; box-shadow: 0 18px 60px #0008; }
    #launch-settings label { display: block; margin-bottom: 7px; }
    #launch-settings select { display: block; box-sizing: border-box; width: 100%; margin: 0 0 20px; padding: 9px 8px; border: 1px solid #666; border-radius: 4px; background: #30303c; color: #eee; font: inherit; color-scheme: dark; }
    #launch-settings select:focus-visible, #start-game:focus-visible { outline: 2px solid #c5c5d3; outline-offset: 3px; }
    #start-game { box-sizing: border-box; width: 100%; padding: 12px 16px; border: 1px solid #e7e7ef; border-radius: 4px; background: #e7e7ef; color: #161620; font: 700 16px/1.4 system-ui, sans-serif; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="loading" hidden>
    <span id="message">Loading runtime…</span>
    <progress id="progress" value="0" max="1"></progress>
    <div id="data-progress">Game data streamed: 0 / 869 MB archive</div>
    <div id="retry-status"></div>
    <div id="build-version">Version: HK-WebGL 2026.11.24-r17-texture2</div>
  </div>

  <section id="launch-settings" aria-label="Game settings">
    <label for="audio-quality">Audio quality</label>
    <select id="audio-quality">
      <option value="24000-mono" selected>Minimum memory — mono, 24 kHz</option>
      <option value="24000">Lower memory — stereo, 24 kHz</option>
      <option value="32000">Balanced — stereo, 32 kHz</option>
      <option value="0">Original — stereo</option>
    </select>
    <label for="render-resolution">Render resolution</label>
    <select id="render-resolution">
      <option value="0.5">50%</option>
      <option value="0.65">65%</option>
      <option value="0.8" selected>80%</option>
      <option value="1">100%</option>
    </select>
    <button type="button" id="start-game">Start game</button>
  </section>

  <script>
    const BUILD_VERSION = 'HK-WebGL 2026.11.24-r17-texture2';
    const BUILD_TOKEN = '2026.11.20-r17';
    // Immutable copy of this archive, used only after two failed CDN reads.
    // Update this revision together with the data geometry if assets change.
    const DATA_FALLBACK_BASE =
      'https://raw.githubusercontent.com/itsspeclix-gif/games/' +
      '5e0d63dc1d5878cf0fa42b8d3caf97613eb7bf1d/hollowknight/build/data4m/';
    const DATA_PART_SIZE = 4 * 1024 * 1024;
    const DATA_TOTAL_SIZE = 869012889;
    const DATA_PART_COUNT = Math.ceil(DATA_TOTAL_SIZE / DATA_PART_SIZE); // 208
    const STARTUP_RETRY_DELAYS = [0, 600, 1400, 2800];
    const WASM_PART_SIZES = [20866662, 12270092];

    // Only wrapper scripts are pinned. Existing asset routes remain relative.
    const RUNTIME_SCRIPT_BASE = "https://cdn.jsdelivr.net/gh/itsspeclix-gif/games@fdbc88ddcbe0b06a8c55f9eccc63093cc8767d3b/hollowknight/build/";
    const buildBase = 'build/';
    const dataBase = buildBase + 'data4m/';

    const TEXTURE_VERSION = '2026.11.22-texture1';
    // This revision contains the existing, flat texture-memory directory.
    // Read the complete add-on from its immutable source: jsDelivr rejects
    // uncached files in this repository with its package-size limit.
    const TEXTURE_ASSET_BASE =
      'https://raw.githubusercontent.com/itsspeclix-gif/games/' +
      'b4e1c706a575aa85a403a7cac94fa08751836160/hollowknight/build/texture-memory/';
    const TEXTURE_MANIFEST_URL = TEXTURE_ASSET_BASE + 'hk.astc.manifest.json';
    const TEXTURE_MANIFEST_SHA256 = "4802f462298bf483622a24e6d9c2a2cd0b3e974e9ff11e59895bb368c7d92460";
    const TEXTURE_MANIFEST_BYTES = 86532;
    const TEXTURE_FS_URL = TEXTURE_ASSET_BASE + 'hk.texturefs.016d263df9ed.js';
    const TEXTURE_FS_SHA256 = '016d263df9ed4fa06190ceec49aa7ff6f098eafbe2eff01442d2be2af4ac22d6';
    const TEXTURE_FS_BYTES = 111475;
    const TEXTURE_PRELOAD_URL = TEXTURE_ASSET_BASE + 'hk.texturepreload.d50fd25e11bc.js';
    const TEXTURE_PRELOAD_SHA256 = 'd50fd25e11bc36e49b076663ec8ac72329d300d34139b632369cbe410fc93bc1';
    const TEXTURE_PRELOAD_BYTES = 39155;


    const canvas = document.getElementById('game');
    const loading = document.getElementById('loading');
    const message = document.getElementById('message');
    const progress = document.getElementById('progress');
    const dataProgress = document.getElementById('data-progress');
    const retryStatus = document.getElementById('retry-status');

    window.__hkBuildVersion = BUILD_VERSION;

    // Launch choices only. No timers, measurements, or controls after Start.
    function installLaunchSettings() {
      const AUDIO_KEY = 'hk.audioMemoryMode';
      const RENDER_KEY = 'hk.renderScale';
      const audioChoices = ['24000-mono', '24000', '32000', '0'];
      const renderChoices = ['0.5', '0.65', '0.8', '1'];
      const inputEvents = ['keydown', 'keyup', 'keypress', 'pointerdown', 'pointerup',
        'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'];
      let disposed = false, accepted = false, controlsRemoved = false, settleStart;
      const startPromise = new Promise(resolve => { settleStart = resolve; });

      function storedChoice(key, allowed, fallback) {
        try {
          const value = localStorage.getItem(key);
          if (allowed.includes(value)) return value;
        } catch (_) { /* Storage is optional for this launch. */ }
        return fallback;
      }

      const initialAudio = storedChoice(AUDIO_KEY, audioChoices, '24000-mono');
      const initialRender = storedChoice(RENDER_KEY, renderChoices, '0.8');
      let panel = document.getElementById('launch-settings');
      let audioSelect = document.getElementById('audio-quality');
      let renderSelect = document.getElementById('render-resolution');
      let startButton = document.getElementById('start-game');
      if (!panel || !audioSelect || !renderSelect || !startButton) {
        throw new Error('Launch settings controls are unavailable.');
      }
      audioSelect.value = initialAudio;
      renderSelect.value = initialRender;

      function stopInput(event) { event.stopPropagation(); }

      function removeControls() {
        if (controlsRemoved) return;
        controlsRemoved = true;
        startButton.removeEventListener('click', start);
        for (const type of inputEvents) panel.removeEventListener(type, stopInput);
        panel.remove();
        // The departure guard outlives the form, but must not retain its nodes.
        panel = audioSelect = renderSelect = startButton = null;
      }

      function start(event) {
        if (event) event.stopPropagation();
        if (disposed || accepted) return;
        // Read the actual selections at acceptance, including changes for which
        // a browser has not yet dispatched a change event.
        const audioToken = audioChoices.includes(audioSelect.value)
          ? audioSelect.value : initialAudio;
        const renderToken = renderChoices.includes(renderSelect.value)
          ? renderSelect.value : initialRender;
        const settings = Object.freeze({
          audioRate: audioToken === '24000-mono' ? 24000 : Number(audioToken),
          audioMono: audioToken === '24000-mono',
          renderScale: Number(renderToken)
        });
        accepted = true;
        try { localStorage.setItem(AUDIO_KEY, audioToken); } catch (_) {}
        try { localStorage.setItem(RENDER_KEY, renderToken); } catch (_) {}
        removeControls();
        const resolve = settleStart;
        settleStart = null;
        resolve(settings);
      }

      function pagehide(event) {
        // A bfcache visit keeps a pending selection. A final departure also
        // marks accepted launches disposed while their first script is loading.
        if (!event.persisted) cleanup();
      }

      function cleanup() {
        if (disposed) return;
        disposed = true;
        removeControls();
        window.removeEventListener('pagehide', pagehide);
        if (settleStart) {
          const resolve = settleStart;
          settleStart = null;
          resolve(null);
        }
      }

      startButton.addEventListener('click', start);
      for (const type of inputEvents) panel.addEventListener(type, stopInput);
      window.addEventListener('pagehide', pagehide);
      return {
        waitForStart() { return startPromise; },
        isDisposed() { return disposed; },
        cleanup
      };
    }
    const launchSettings = installLaunchSettings();

    const nativeFetch = window.fetch.bind(window);

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function formatMB(bytes) {
      return Math.round(bytes / 1e6);
    }

    function resourceLabel(input) {
      const raw =
        typeof input === 'string'
          ? input
          : (input && input.url ? input.url : 'resource');

      const clean = String(raw).split('?')[0];
      return clean.split('/').pop() || 'resource';
    }

    function setRetryStatus(text) {
      retryStatus.textContent = text || '';
    }

    async function fetchWithRetry(input, init = {}, label) {
      let lastError = null;

      for (
        let attempt = 0;
        attempt < STARTUP_RETRY_DELAYS.length;
        attempt += 1
      ) {
        if (attempt > 0) {
          setRetryStatus(
            'Connection interrupted — retrying ' +
            (label || resourceLabel(input)) +
            ' (' + (attempt + 1) + '/' +
            STARTUP_RETRY_DELAYS.length + ')…'
          );

          await wait(STARTUP_RETRY_DELAYS[attempt]);
        }

        try {
          const retryInit = Object.assign({}, init);

          if (attempt > 0) {
            retryInit.cache = 'reload';
          }

          const response = await nativeFetch(input, retryInit);

          if (
            response.ok ||
            response.status === 304 ||
            attempt + 1 === STARTUP_RETRY_DELAYS.length
          ) {
            if (attempt > 0 && response.ok) {
              setRetryStatus('Connection restored.');
              setTimeout(() => {
                if (retryStatus.textContent === 'Connection restored.') {
                  setRetryStatus('');
                }
              }, 900);
            }

            return response;
          }

          lastError = new Error(
            'HTTP ' + response.status + ' for ' +
            resourceLabel(input)
          );

          try {
            if (response.body) await response.body.cancel();
          } catch (_) {}
        } catch (error) {
          lastError = error;

          if (attempt + 1 === STARTUP_RETRY_DELAYS.length) {
            throw error;
          }
        }
      }

      throw lastError || new Error('Startup request failed');
    }

    function installStartupFetchRetry() {
      const previousFetch = window.fetch;

      const wrappedFetch = (input, init) =>
        fetchWithRetry(input, init, resourceLabel(input));

      window.fetch = wrappedFetch;

      return () => {
        if (window.fetch === wrappedFetch) {
          window.fetch = previousFetch;
        }
      };
    }

    function conciseStartupError(error) {
      const raw =
        error && error.message
          ? error.message
          : String(error);

      if (
        /hk\.data\.part/i.test(raw) ||
        /jsdelivr/i.test(raw) ||
        /network/i.test(raw) ||
        /failed to fetch/i.test(raw)
      ) {
        return (
          'Network/CDN error while loading Hollow Knight data. ' +
          'Automatic retries were exhausted. Reload and try again.'
        );
      }

      return raw.length > 320
        ? raw.slice(0, 320) + '…'
        : raw;
    }

    function updateDataProgress() {
      const stats = window.__hkLazyStats;

      if (!stats) {
        dataProgress.textContent =
          'Game data streamed: 0 / ' +
          formatMB(DATA_TOTAL_SIZE) +
          ' MB archive';
        return;
      }

      const uniqueDemanded = Math.max(
        0,
        Number(stats.uniqueParts) || 0
      );

      const bootstrapLoaded =
        Number(stats.cacheItems) > 0 ? 1 : 0;

      const uniqueParts = Math.min(
        DATA_PART_COUNT,
        uniqueDemanded + bootstrapLoaded
      );

      let bytes = Math.min(
        DATA_TOTAL_SIZE,
        uniqueParts * DATA_PART_SIZE
      );

      if (uniqueParts >= DATA_PART_COUNT) {
        bytes = DATA_TOTAL_SIZE;
      }

      dataProgress.textContent =
        'Game data streamed: ' +
        formatMB(bytes) +
        ' / ' +
        formatMB(DATA_TOTAL_SIZE) +
        ' MB archive';
    }

    let dataProgressTimer = null;

    function numberedUrls(base, prefix, count) {
      return Array.from(
        { length: count },
        (_, index) => base + prefix + '.part' + (index + 1)
      );
    }

    function loadScriptOnce(url) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = url;
        script.onload = () => {
          script.remove();
          resolve();
        };
        script.onerror = () => {
          script.remove();
          reject(new Error('Could not load ' + url));
        };
        document.head.appendChild(script);
      });
    }

    async function loadScript(url, label) {
      let lastError = null;

      for (
        let attempt = 0;
        attempt < STARTUP_RETRY_DELAYS.length;
        attempt += 1
      ) {
        if (attempt > 0) {
          setRetryStatus(
            'Connection interrupted — retrying ' +
            (label || resourceLabel(url)) +
            ' (' + (attempt + 1) + '/' +
            STARTUP_RETRY_DELAYS.length + ')…'
          );

          await wait(STARTUP_RETRY_DELAYS[attempt]);
        }

        const retryUrl =
          attempt === 0
            ? url
            : url +
              (url.includes('?') ? '&' : '?') +
              'retry=' + attempt + '-' + Date.now();

        try {
          await loadScriptOnce(retryUrl);

          if (attempt > 0) {
            setRetryStatus('Connection restored.');
            setTimeout(() => {
              if (retryStatus.textContent === 'Connection restored.') {
                setRetryStatus('');
              }
            }, 900);
          }

          return;
        } catch (error) {
          lastError = error;
        }
      }

      throw lastError || new Error('Could not load ' + url);
    }

    // Compile the unchanged two-part WASM before Unity allocates its heap.
    // The normal path feeds one backpressured network chunk at a time into the
    // browser compiler. It never constructs a complete WASM Blob/ArrayBuffer.
    async function compileRuntime(urls, sizes, signal = null) {
      if (urls.length !== sizes.length || sizes.some(size => !Number.isSafeInteger(size) || size <= 0)) {
        throw new Error('Invalid runtime part geometry');
      }
      const total = sizes.reduce((sum, size) => sum + size, 0);
      if (!Number.isSafeInteger(total) || !total) throw new Error('Invalid runtime binary size');
      const stats = window.__hkWasmStartupStats = {
        phase: 'compiling', mode: '', expectedBytes: total,
        compileAttempts: 0, bodyRestarts: 0, headerRetries: 0,
        networkBytes: 0, maxChunkBytes: 0,
        assemblyBytes: 0, partArrayBufferBytes: 0,
        wrapperRetainedSourceBytes: 0, lastError: ''
      };
      let streamSupported = typeof WebAssembly.compileStreaming === 'function' &&
        typeof ReadableStream === 'function' && typeof Response === 'function';

      function session(reload) {
        let part = 0, partBytes = 0, reader = null, request = null;
        let timer = null, stopped = false;
        const state = { error: null, stage: '', unsupported: false };
        const abort = () => { stopped = true; if (request) request.abort(); };
        if (signal) signal.addEventListener('abort', abort, { once: true });
        async function bounded(action) {
          timer = setTimeout(() => { if (request) request.abort(); }, 30000);
          try { return await action(); }
          finally { clearTimeout(timer); timer = null; }
        }
        async function close() {
          stopped = true;
          if (signal) signal.removeEventListener('abort', abort);
          clearTimeout(timer); timer = null;
          if (request) request.abort();
          if (reader) {
            try { await reader.cancel(); } catch (_) {}
            try { reader.releaseLock(); } catch (_) {}
          }
          reader = request = null;
        }
        async function open() {
          message.textContent = 'Loading runtime ' + (part + 1) + ' of ' + urls.length + '…';
          for (let attempt = 0; attempt < STARTUP_RETRY_DELAYS.length; attempt += 1) {
            if (stopped || (signal && signal.aborted)) throw new Error('Runtime download cancelled');
            if (attempt) {
              stats.headerRetries += 1;
              setRetryStatus('Connection interrupted — retrying runtime ' + (part + 1) +
                ' (' + (attempt + 1) + '/' + STARTUP_RETRY_DELAYS.length + ')…');
              await wait(STARTUP_RETRY_DELAYS[attempt]);
              if (stopped || (signal && signal.aborted)) throw new Error('Runtime download cancelled');
            }
            request = new AbortController();
            let response;
            try {
              response = await bounded(() => nativeFetch(urls[part], {
                cache: reload || attempt ? 'reload' : 'force-cache',
                credentials: 'same-origin', signal: request.signal
              }));
              if (!response.ok) throw new Error('Runtime part ' + (part + 1) + ': HTTP ' + response.status);
              // Transfer length is checked from decoded bytes, not HTTP headers
              // (Content-Length may describe a compressed transport encoding).
              return response;
            } catch (error) {
              request.abort();
              if (response && response.body) {
                try { await response.body.cancel(); } catch (_) {}
              }
              if (stopped || (signal && signal.aborted) ||
                  attempt + 1 === STARTUP_RETRY_DELAYS.length) throw error;
            }
          }
        }
        async function next(allowPartBuffer) {
          try {
            while (part < urls.length) {
              if (stopped || (signal && signal.aborted)) throw new Error('Runtime download cancelled');
              if (!reader) {
                state.stage = 'headers';
                const response = await open();
                state.stage = 'body';
                if (!response.body || typeof response.body.getReader !== 'function') {
                  if (!allowPartBuffer) {
                    state.unsupported = true;
                    throw new Error('Runtime response streaming is unavailable');
                  }
                  const bytes = new Uint8Array(await bounded(() => response.arrayBuffer()));
                  if (bytes.length !== sizes[part]) throw new Error('Incorrect runtime part length');
                  stats.partArrayBufferBytes = Math.max(stats.partArrayBufferBytes, bytes.byteLength);
                  stats.networkBytes += bytes.length;
                  part += 1;
                  request = null;
                  return { done: false, value: bytes };
                }
                reader = response.body.getReader();
                partBytes = 0;
              }
              const item = await bounded(() => reader.read());
              if (item.done) {
                if (partBytes !== sizes[part]) throw new Error('Incorrect runtime part length');
                reader.releaseLock(); reader = request = null;
                part += 1;
                continue;
              }
              partBytes += item.value.byteLength;
              if (partBytes > sizes[part]) throw new Error('Oversized runtime part');
              stats.networkBytes += item.value.byteLength;
              stats.maxChunkBytes = Math.max(stats.maxChunkBytes, item.value.byteLength);
              return item;
            }
            state.stage = '';
            return { done: true };
          } catch (error) { state.error = error; throw error; }
        }
        return { next, close, state };
      }

      // An already-consumed partial module cannot be rewound. A body failure
      // cancels that compiler input and restarts from part 1 with fresh requests.
      for (let attempt = 0; attempt < STARTUP_RETRY_DELAYS.length; attempt += 1) {
        if (signal && signal.aborted) { stats.phase = 'cancelled'; throw new Error('Runtime download cancelled'); }
        if (attempt) {
          stats.bodyRestarts += 1;
          setRetryStatus('Runtime download interrupted — restarting (' +
            (attempt + 1) + '/' + STARTUP_RETRY_DELAYS.length + ')…');
          await wait(STARTUP_RETRY_DELAYS[attempt]);
        }
        const source = session(attempt > 0);
        let assembly = null;
        try {
          stats.compileAttempts += 1;
          let compiled;
          if (streamSupported) {
            stats.mode = 'stream';
            const body = new ReadableStream({
              async pull(controller) {
                try {
                  const item = await source.next(false);
                  if (item.done) controller.close(); else controller.enqueue(item.value);
                } catch (error) { controller.error(error); }
              },
              cancel() { return source.close(); }
            }, { highWaterMark: 0 });
            compiled = await WebAssembly.compileStreaming(new Response(body, {
              headers: { 'Content-Type': 'application/wasm' }
            }));
          } else {
            stats.mode = 'single-buffer-fallback';
            assembly = new Uint8Array(total);
            stats.assemblyBytes = total;
            stats.wrapperRetainedSourceBytes = total;
            let offset = 0;
            while (true) {
              const item = await source.next(true);
              if (item.done) break;
              assembly.set(item.value, offset); offset += item.value.byteLength;
            }
            if (offset !== total) throw new Error('Incorrect runtime binary length');
            compiled = await WebAssembly.compile(assembly);
          }
          if (signal && signal.aborted) throw new Error('Runtime download cancelled');
          stats.phase = 'compiled';
          stats.lastError = '';
          setRetryStatus('');
          return compiled;
        } catch (error) {
          stats.lastError = error && error.message ? error.message : String(error);
          if (signal && signal.aborted) { stats.phase = 'cancelled'; throw error; }
          // Some older engines expose compileStreaming but reject synthetic
          // Response streams. A single-buffer compile is a bounded fallback.
          if (streamSupported && (source.state.unsupported ||
              (!source.state.error && error instanceof TypeError))) {
            streamSupported = false;
            attempt -= 1;
            continue;
          }
          if (!source.state.error || source.state.stage !== 'body' ||
              attempt + 1 === STARTUP_RETRY_DELAYS.length) {
            stats.phase = 'failed';
            throw error;
          }
        } finally {
          assembly = null;
          stats.wrapperRetainedSourceBytes = 0;
          await source.close();
        }
      }
      throw new Error('Runtime download failed');
    }

    function createWasmInstantiation(compiled) {
      let disposed = false, pending = null;
      function fail(owner, error, cancelled) {
        window.__hkWasmStartupStats.phase = cancelled ? 'cancelled' : 'failed';
        window.__hkWasmStartupStats.lastError = String(error && error.message || error);
        if (owner && owner.startupErrorHandler) owner.startupErrorHandler(error);
        else if (!cancelled && owner && owner.abortHandler) owner.abortHandler(String(error));
        else if (!cancelled) console.error(error);
      }
      function cancelOwner(owner) {
        fail(owner, new Error('The Hollow Knight session has already ended.'), true);
      }
      return {
        instantiate: function (imports, receiveInstance) {
          if (disposed) { cancelOwner(this); return {}; }
          if (!compiled) throw new Error('Runtime module was already consumed');
          // Only this small holder is captured by the native instantiation
          // promise. Retirement clears its engine and callback references.
          const holder = pending = { owner: this, receive: receiveInstance };
          let task;
          try { task = WebAssembly.instantiate(compiled, imports); }
          catch (error) {
            const owner = holder.owner;
            pending = null; holder.owner = holder.receive = null;
            fail(owner, error, false);
            return {};
          } finally { compiled = null; }
          Promise.resolve(task).then(instance => {
            if (disposed || pending !== holder) return;
            const owner = holder.owner, receive = holder.receive;
            pending = null; holder.owner = holder.receive = null;
            window.__hkWasmStartupStats.phase = 'instantiated';
            try { receive(instance); }
            catch (error) { fail(owner, error, false); }
          }, error => {
            if (disposed || pending !== holder) return;
            const owner = holder.owner;
            pending = null; holder.owner = holder.receive = null;
            fail(owner, error, false);
          });
          // This legacy Emscripten hook expects an immediate empty export
          // object; its receiveInstance callback resolves wasm-instantiate.
          return {};
        },
        dispose: function () {
          if (disposed) return;
          disposed = true;
          const wasUnconsumed = Boolean(compiled);
          compiled = null;
          if (pending) {
            const owner = pending.owner;
            pending.owner = pending.receive = null;

    async function prepareFrameworkUrl() {
      const sourceUrl =
        buildBase +
        'hk.framework.js?v=' +
        encodeURIComponent(BUILD_TOKEN);

      const response = await fetchWithRetry(
        sourceUrl,
        { cache: 'force-cache' },
        'framework'
      );

      if (!response.ok) {
        throw new Error(
          'Could not load framework (' + response.status + ')'
        );
      }

      // The existing framework is patched only in this short-lived Blob.
      // A mismatched layout fails visibly instead of silently skipping the fix.
      const source = prepareHollowKnightTextureFramework(prepareHollowKnightAudioFramework(
        prepareHollowKnightFramework(await response.text())
      ));
      frameworkObjectUrl = URL.createObjectURL(
        new Blob([source], { type: 'text/javascript' })
      );

      return frameworkObjectUrl;
    }

    async function verifyTextureBytes(bytes, expectedLength, expectedHash, label) {
      if (bytes.byteLength !== expectedLength) throw new Error(label + ' length differs');
      if (window.crypto && window.crypto.subtle) {
        const digest = await window.crypto.subtle.digest('SHA-256', bytes);
        const hash = Array.from(new Uint8Array(digest), value => value.toString(16).padStart(2, '0')).join('');
        if (hash !== expectedHash) throw new Error(label + ' identity differs');
      }
    }

    async function loadTextureScript(url, expectedLength, expectedHash, label) {
      // Raw GitHub is a fetch source, not a script element source: its MIME
      // type forbids direct script execution. Execute verified bytes through
      // the same Blob mechanism already used by the Unity framework.
      const response = await fetchWithRetry(url, { cache: 'force-cache' }, label);
      if (!response.ok) throw new Error(label + ' HTTP ' + response.status);
      const bytes = await response.arrayBuffer();
      await verifyTextureBytes(bytes, expectedLength, expectedHash, label);
      if (launchSettings.isDisposed()) throw new Error('The Hollow Knight session has already ended.');
      const scriptUrl = URL.createObjectURL(new Blob([bytes], { type: 'text/javascript' }));
      try { await loadScriptOnce(scriptUrl); }
      finally { URL.revokeObjectURL(scriptUrl); }
    }

          const block = new Uint8Array([252,253,255,255,255,255,255,255,127,127,63,63,191,191,255,255]);
          // Test non-block-aligned dimensions as well as linear/sRGB uploads.
          for (const [format, footprint] of [[0x93b0,4],[0x93d0,4],[0x93b4,6],[0x93d4,6]]) {
            if (!formats.includes(format)) return false;
            const count = Math.ceil(7 / footprint) * Math.ceil(5 / footprint);
            const pixels = new Uint8Array(count * 16);
            for (let i = 0; i < count; i++) pixels.set(block, i * 16);
            texture = gl.createTexture();
            if (!texture) return false;
            gl.bindTexture(gl.TEXTURE_2D, texture);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.compressedTexImage2D(gl.TEXTURE_2D, 0, format, 7, 5, 0, pixels);
            if (gl.getError() !== gl.NO_ERROR) return false;
            gl.deleteTexture(texture);
            texture = null;
          }
        } catch (_) {
          return false;
        } finally {
          if (gl) {
            try { if (texture) gl.deleteTexture(texture); } catch (_) {}
            try {
              const lose = gl.getExtension('WEBGL_lose_context');
              if (lose) lose.loseContext();
            } catch (_) {}
          }
          probe.width = probe.height = 1;
        }
      }
      return foundContext;
    }

    async function loadTextureManifest() {
      const manifestUrl = new URL(TEXTURE_MANIFEST_URL, document.baseURI).href;
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15000);
      const leave = event => { if (!event.persisted) controller.abort(); };
      window.addEventListener('pagehide', leave);
      try {
        const response = await nativeFetch(manifestUrl, {
          signal: controller.signal, cache: 'force-cache'
        });
        if (!response.ok) throw new Error('Texture manifest HTTP ' + response.status);
        const bytes = await response.arrayBuffer();
        await verifyTextureBytes(bytes, TEXTURE_MANIFEST_BYTES, TEXTURE_MANIFEST_SHA256, 'Texture manifest');
        const manifest = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(bytes));
        const base = manifest.baseArchive;
        if (manifest.schemaVersion !== 1 || !base ||
            base.partSize !== DATA_PART_SIZE || base.partCount !== DATA_PART_COUNT ||
            base.totalSize !== DATA_TOTAL_SIZE || base.unityFileOffset !== 9705719 ||
            base.unityFileSize !== 583132840) throw new Error('Texture manifest base differs');
        return { manifest, manifestUrl };
      } finally {
        clearTimeout(timer);
        window.removeEventListener('pagehide', leave);
      }
    }

    function prepareHollowKnightTextureFramework(source) {
      // This exact Unity build recognizes the historical WebGL LDR name.
      // Advertise the equivalent alias only when real hardware support exists.
      // All three enumeration paths must return a consistent extension count.
      const supported = 'GLctx.getSupportedExtensions()';
      if (source.split(supported).length !== 4) {
        throw new Error('Unexpected Unity graphics layout; texture compatibility patch was not applied.');
      }
      source = source.split(supported).join('hkGetTextureExtensions()');
      const helper = `function hkGetTextureExtensions(){
  var list=GLctx.getSupportedExtensions()||[];
  if(!Module.__hkTextureASTC)return list;
  var ext=GLctx.getExtension("WEBGL_compressed_texture_astc");
  if(!ext||typeof ext.getSupportedProfiles!=="function"||ext.getSupportedProfiles().indexOf("ldr")<0){
    throw new Error("The game graphics context cannot use the selected compressed textures. Reopen the game to select a compatible asset set.");
  }
  var alias="WEBGL_compressed_texture_astc_ldr";
  return list.indexOf(alias)<0?list.concat([alias]):list;
}
`;
      const anchor = 'function _glGetString(e){';
      if (source.split(anchor).length !== 2) throw new Error('Unexpected Unity extension entry point.');
      source = source.replace(anchor, helper + anchor);
      const enable = 'return 0==t.indexOf("GL_")&&(t=t.substr(3)),n.GLctx.getExtension(t)?1:0';
      if (source.split(enable).length !== 2) throw new Error('Unexpected Unity extension enable entry point.');
      source = source.replace(enable,
        'if(0==t.indexOf("GL_"))t=t.substr(3);' +
        'if(Module.__hkTextureASTC&&t==="WEBGL_compressed_texture_astc_ldr"){' +
          'var a=n.GLctx.getExtension("WEBGL_compressed_texture_astc");' +
          'return a&&typeof a.getSupportedProfiles==="function"&&a.getSupportedProfiles().indexOf("ldr")>=0?1:0;' +
        '}return n.GLctx.getExtension(t)?1:0');
      return source;
    }

    function installNeighborPreload() {
      if (preloadInstallTask) return preloadInstallTask;
      if (!preloadModule || document.hidden || (lifecycle && lifecycle.state.paused)) return Promise.resolve();
      if (preloadRetryTimer !== null) clearTimeout(preloadRetryTimer);
      preloadRetryTimer = null;
      preloadInstallTask = installHollowKnightNeighborPreload({ Module: preloadModule }, {
        mapUrl: buildBase + 'preload-analysis/preload-map.analysis.json',
        dataPartUrls: preloadUrls,
        partSize: DATA_PART_SIZE
      }).then(() => {
        delete window.__hkPreloadError;
        const notice = document.getElementById('preload-warning');
        if (notice) notice.remove();
        document.removeEventListener('visibilitychange', installNeighborPreload);
        window.removeEventListener('online', installNeighborPreload);
        document.removeEventListener('hk-game-resumed', installNeighborPreload);
        preloadModule = preloadUrls = null;
      }).catch(error => {
        reportPreloadError(error);
        // Metadata initialization failures must not leave an otherwise healthy
        // game permanently without preloading. No retries while hidden.
        preloadRetryTimer = setTimeout(installNeighborPreload, 60000);
      }).finally(() => { preloadInstallTask = null; });
      return preloadInstallTask;
    }

    function reportPreloadError(error) {
      window.__hkPreloadError = error && error.message ? error.message : String(error);
      console.warn('Neighbor preload unavailable:', error);
      let notice = document.getElementById('preload-warning');
      if (!notice) {
        notice = document.createElement('div');
        notice.id = 'preload-warning';
        notice.setAttribute('role', 'status');
        notice.style.cssText = 'position:fixed;bottom:8px;left:8px;right:8px;z-index:20;' +
          'padding:6px 9px;color:#fff;background:rgba(0,0,0,.75);font:12px system-ui;' +
          'pointer-events:none';
        document.body.appendChild(notice);
      }
      notice.textContent = 'Neighbor preloading unavailable; room changes may be slower.';
    }

    async function startGame() {
      try {
        const launchChoice = await launchSettings.waitForStart();
        if (launchChoice === null || launchSettings.isDisposed()) return;
        loading.hidden = false;
        dataProgressTimer = setInterval(updateDataProgress, 180);
        setRetryStatus('');

        const versionQuery =
          '?v=' + encodeURIComponent(BUILD_TOKEN);

        if (probeTextureSupport()) {
          try {
            message.textContent = 'Preparing textures…';
            textureOverlay = await loadTextureManifest();
            if (launchSettings.isDisposed()) return;
            await loadTextureScript(TEXTURE_FS_URL, TEXTURE_FS_BYTES, TEXTURE_FS_SHA256, 'Texture filesystem');
            if (window.__hkTextureOverlayVersion !== TEXTURE_VERSION ||
                window.__hkStabilityFSVersion !== BUILD_TOKEN) {
              throw new Error('Texture filesystem version differs');
            }
          } catch (error) {
            textureOverlay = null;
            if (launchSettings.isDisposed()) return;
            console.warn('Using original textures for this launch:', error);
            setRetryStatus('');
          }
        }
        if (!textureOverlay) {
          await loadScript(
            RUNTIME_SCRIPT_BASE + 'hk.stabilityfs.js' + versionQuery,
            'filesystem'
          );
        }
        // The waiting screen owns departure until the runtime lifecycle exists.
        if (launchSettings.isDisposed()) return;

        if (window.__hkStabilityFSVersion !== BUILD_TOKEN) {
          throw new Error('Filesystem script mismatch: expected ' + BUILD_TOKEN + ', received ' + (window.__hkStabilityFSVersion || 'no version') + '. Reopen the updated game page.');
        }

        lifecycle = installHollowKnightLifecycle(canvas);
        startupAbort = new AbortController();
        const cleanupLifecycle = lifecycle.cleanup;
        lifecycle.cleanup = function () {
          revokeRuntimeUrl();
          launchSettings.cleanup();
          cleanupLifecycle();
        };
        document.addEventListener('hk-game-resumed', installNeighborPreload);

        await loadScript(
          RUNTIME_SCRIPT_BASE + 'hk.loader.js' + versionQuery,
          'loader'
        );

        if (window.__hkLoaderVersion !== BUILD_TOKEN) {
          throw new Error('Loader script mismatch: expected ' + BUILD_TOKEN + ', received ' + (window.__hkLoaderVersion || 'no version') + '. Reopen the updated game page.');
        }

        let neighborPreloadReady = false;
        try {
          if (textureOverlay) {
            await loadTextureScript(TEXTURE_PRELOAD_URL, TEXTURE_PRELOAD_BYTES, TEXTURE_PRELOAD_SHA256, 'Texture preloader');
          } else {
            await loadScript(RUNTIME_SCRIPT_BASE + 'hk.preload.js' + versionQuery, 'preloader');
          }
          neighborPreloadReady =
            typeof window.installHollowKnightNeighborPreload === 'function' &&
            window.__hkPreloadVersion === BUILD_TOKEN &&
            (!textureOverlay || window.__hkTexturePreloadVersion === TEXTURE_VERSION);
          if (!neighborPreloadReady) throw new Error('Preloader script is incompatible: expected ' + BUILD_TOKEN + ', received ' + (window.__hkPreloadVersion || 'no version') + '. Reopen the updated game page.');
        } catch (error) {
          reportPreloadError(error);
        }

        wasmStartup = createWasmInstantiation(await compileRuntime(
          numberedUrls(buildBase, 'hk.wasm', WASM_PART_SIZES.length),
          WASM_PART_SIZES,
          startupAbort.signal
        ));

        message.textContent = 'Loading framework…';

        const frameworkUrl = await prepareFrameworkUrl();
        if (lifecycle.state.phase === 'disposed') throw new Error('The Hollow Knight session has already ended.');

        message.textContent = 'Starting game…';

        const unityConfig = {
          __hkLifecycle: lifecycle,
          __hkTextureASTC: Boolean(textureOverlay),
          __hkAudioDecodeSampleRate: launchChoice.audioRate,
          __hkAudioMono: launchChoice.audioMono,
          preMainLoop: () => lifecycle.beforeFrame(),
          errorHandler: error => lifecycle.runtimeError(error),
          // Keep desktop growth unchanged. iPadOS can present a Mac user agent.
          __hkMaxHeapGrowthSlack: /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
            ? 16 * 1024 * 1024 : 0,
          devicePixelRatio: launchChoice.renderScale,
          frameworkUrl,
          // Compilation has completed; the generated runtime uses this hook
          // and never requests an assembled codeUrl or stores wasmBinary.
          instantiateWasm: wasmStartup.instantiate,
          dataPartUrls: numberedUrls(dataBase, 'hk.data', DATA_PART_COUNT),
          mountDataParts: async (module, urls) => {
            lifecycle.bind(module);
            await mountUnityDataParts(module, urls, {
              partSize: DATA_PART_SIZE,
              totalSize: DATA_TOTAL_SIZE,
              textureOverlay,
              onProgress: updateMountProgress,
              fallbackUrls: numberedUrls(DATA_FALLBACK_BASE, 'hk.data', DATA_PART_COUNT),
              onReadError: reportDataReadError
            });
            // The mounted filesystem now owns normalized ranges and preload
            // metadata. Release the raw manifest wrapper from page startup.
            textureOverlay = null;
            // Install while the loader's data dependency is still held, BEFORE
            // Unity can open its first room. A late post-start hook misses them.
            if (neighborPreloadReady) {
              preloadModule = module;
              preloadUrls = urls;
              document.addEventListener('visibilitychange', installNeighborPreload);
              window.addEventListener('online', installNeighborPreload);
              await installNeighborPreload();
            }
          }
        };

        const restoreStartupFetch =
          installStartupFetchRetry();

        let instance;

        try {
          instance = await createUnityInstance(
            canvas,
            unityConfig,
            value => {
              progress.value = value;
              updateDataProgress();
            }
          );
        } finally {
          restoreStartupFetch();
        }

        // Deliberately exposed for independent diagnostics/bookmarklets.
        window.__hkUnityInstance = instance;

        installHollowKnightPersistence(instance.Module);
        installHollowKnightKeyboardBridge(canvas);
        lifecycle.ready();

        updateDataProgress();

        if (dataProgressTimer) {
          clearInterval(dataProgressTimer);
          dataProgressTimer = null;
        }

        revokeRuntimeUrl();
        if (!window.__hkLastReadFailure) loading.remove();
      } catch (error) {
        if (dataProgressTimer) {
          clearInterval(dataProgressTimer);
          dataProgressTimer = null;
        }

        revokeRuntimeUrl();
        if (launchSettings.isDisposed() || (lifecycle && lifecycle.state.phase === 'disposed')) return;
        console.error(error);
        setRetryStatus('');

        if (window.__hkLastReadFailure) {
          reportDataReadError(window.__hkLastReadFailure);
        } else {
          message.textContent = 'Unable to start: ' + conciseStartupError(error);
        }
      } finally {
        // Also cover a departure during the first script await, before the
        // normal lifecycle and startup-error cleanup have been installed.
        if (launchSettings.isDisposed() && dataProgressTimer) {
          clearInterval(dataProgressTimer);
          dataProgressTimer = null;
        }
      }
    }

    startGame();
  </script>
</body>
</html>
