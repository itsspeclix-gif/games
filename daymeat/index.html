<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>daymeat</title>
  <style>
    html, body, #app-container {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0f1117;
    }

    #app-container {
      display: grid;
      place-items: center;
    }

    #canvas-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #fff;
      font: 600 16px/1.2 system-ui, sans-serif;
      pointer-events: none;
    }
  </style>
  <script src="poki-sdk.js"></script>
  <script src="dmloader.js"></script>
</head>
<body>
  <div id="app-container">
    <div id="canvas-container">
      <canvas id="canvas" tabindex="1" width="1067" height="600"></canvas>
      <div id="loading">Loading&hellip;</div>
    </div>
  </div>

  <script>
    var Module = window.Module || {};
    var loading = document.getElementById('loading');
    var started = false;

    var extraParams = {
      archive_location_filter: function (path) {
        return 'archive' + path;
      },
      engine_arguments: ['--verify-graphics-calls=false'],
      custom_heap_size: 67108864,
      full_screen_container: '#canvas-container',
      disable_context_menu: true
    };

    Module.INITIAL_MEMORY = extraParams.custom_heap_size;
    Module.locateFile = function (path, scriptDirectory) {
      if (path === 'dmengine.wasm' || path === 'dmengine_release.wasm' || path === 'dmengine_headless.wasm') {
        path = 'daymeat.wasm';
      }
      return scriptDirectory + path;
    };

    Progress.addListener(function (percentage) {
      if (typeof percentage === 'number' && !isNaN(percentage)) {
        loading.textContent = 'Loading ' + percentage.toFixed(0) + '%';
        if (percentage >= 100) {
          loading.remove();
        }
      }
    });

    Module.onRuntimeInitialized = function () {
      if (started) return;
      started = true;

      var sdkReady = window.PokiSDK && typeof PokiSDK.init === 'function'
        ? PokiSDK.init()
        : Promise.resolve();

      sdkReady.catch(function () {}).then(function () {
        Module.runApp('canvas', extraParams);
      });
    };

    EngineLoader.stream_wasm = false;
    EngineLoader.load('canvas', 'daymeat');
  </script>
</body>
</html>
