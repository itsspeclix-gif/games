<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0"
  >

  <title>Buckshot Roulette</title>

  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="buckshot-roulette.icon.png">
  <link rel="apple-touch-icon" href="buckshot-roulette.icon.png">

  <style>
    #loading-text {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 18px;
      z-index: 1000;
    }
  </style>
</head>

<body>

  <canvas id="canvas" tabindex="0">
    Your browser does not support the canvas tag.
  </canvas>

  <noscript>
    Your browser does not support JavaScript.
  </noscript>

  <div id="loading-text">
    Loading Buckshot Roulette...
  </div>

  <div id="status">
    <progress id="status-progress"></progress>
    <div id="status-notice"></div>
  </div>

  <!-- Load the Godot runtime FIRST -->
  <script src="buckshot-roulette.js"></script>

  <!-- Define the Godot launch function BEFORE main.js starts downloading -->
  <script>
    const GODOT_CONFIG = {
      args: [],
      canvasResizePolicy: 2,
      ensureCrossOriginIsolationHeaders: false,
      executable: "buckshot-roulette",
      experimentalVK: false,

      fileSizes: {
        "buckshot-roulette.pck": 344705792,
        "buckshot-roulette.wasm": 43444261
      },

      focusCanvas: false,
      gdextensionLibs: []
    };

    const GODOT_THREADS_ENABLED = false;
    const engine = new Engine(GODOT_CONFIG);

    function run() {
      const loadingText =
        document.getElementById("loading-text");

      const statusOverlay =
        document.getElementById("status");

      const statusProgress =
        document.getElementById("status-progress");

      const statusNotice =
        document.getElementById("status-notice");

      if (loadingText) {
        loadingText.remove();
      }

      let initializing = true;
      let statusMode = "";

      function setStatusMode(mode) {
        if (statusMode === mode || !initializing) {
          return;
        }

        if (mode === "hidden") {
          statusOverlay.remove();
          initializing = false;
          return;
        }

        statusOverlay.style.visibility = "visible";

        statusProgress.style.display =
          mode === "progress" ? "block" : "none";

        statusNotice.style.display =
          mode === "notice" ? "block" : "none";

        statusMode = mode;
      }

      function setStatusNotice(text) {
        while (statusNotice.lastChild) {
          statusNotice.removeChild(
            statusNotice.lastChild
          );
        }

        text.split("\n").forEach((line) => {
          statusNotice.appendChild(
            document.createTextNode(line)
          );

          statusNotice.appendChild(
            document.createElement("br")
          );
        });
      }

      function displayFailureNotice(err) {
        console.error(err);

        if (err instanceof Error) {
          setStatusNotice(err.message);
        } else if (typeof err === "string") {
          setStatusNotice(err);
        } else {
          setStatusNotice(
            "An unknown error occurred."
          );
        }

        setStatusMode("notice");
        initializing = false;
      }

      const missing = Engine.getMissingFeatures({
        threads: GODOT_THREADS_ENABLED
      });

      if (missing.length !== 0) {
        displayFailureNotice(
          "Error\nThe following features required " +
          "to run Godot are missing:\n" +
          missing.join("\n")
        );

        return;
      }

      setStatusMode("progress");

      engine.startGame({
        onProgress(current, total) {
          if (current > 0 && total > 0) {
            statusProgress.value = current;
            statusProgress.max = total;
          } else {
            statusProgress.removeAttribute("value");
            statusProgress.removeAttribute("max");
          }
        }
      }).then(
        () => setStatusMode("hidden"),
        displayFailureNotice
      );
    }

    window.godotRunStart = run;
  </script>

  <!-- Start downloading/merging the split PCK + WASM LAST -->
  <script src="main.js"></script>

</body>
</html>
