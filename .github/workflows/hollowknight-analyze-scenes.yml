name: Analyze Hollow Knight scene preload map

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hollowknight-analyze-scenes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Unity parser
        shell: bash
        run: |
          python3 -m pip install --quiet UnityPy

      - name: Download pinned vanilla transition data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hk-reference
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/homothetyhk/RandomizerMod/cad3d5a7b73ed3ddf4af43795b20c23ced14bb4c/RandomizerMod/Resources/Data/transitions.json" \
            -o /tmp/hk-reference/transitions.json

      - name: Analyze archive, exact scene list, chunks, and neighbors
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import bisect
          import csv
          import importlib.metadata
          import json
          import re
          import shutil
          import struct
          from collections import defaultdict
          from pathlib import Path

          import UnityPy

          ROOT = Path("hollowknight/build")
          OUT = ROOT / "analysis"
          TMP = Path("/tmp/hk-scene-analysis")
          TRANSITIONS_PATH = Path("/tmp/hk-reference/transitions.json")

          SOURCE_COUNT = 42
          SOURCE_NORMAL = 20_866_662
          SOURCE_FINAL = 13_479_747
          TOTAL_SIZE = 869_012_889
          PHYSICAL_CHUNK = 4 * 1024 * 1024
          EXPECTED_CHUNKS = 208

          MAGIC = b"UnityWebData1.0\x00"
          HEADER_PREFIX_SIZE = len(MAGIC) + 4

          if OUT.exists():
              shutil.rmtree(OUT)
          OUT.mkdir(parents=True)
          if TMP.exists():
              shutil.rmtree(TMP)
          TMP.mkdir(parents=True)

          source_parts = [
              ROOT / f"hk.data.part{i}"
              for i in range(1, SOURCE_COUNT + 1)
          ]

          for i, path in enumerate(source_parts, 1):
              if not path.is_file():
                  raise SystemExit(f"Missing source part: {path}")
              expected = SOURCE_FINAL if i == SOURCE_COUNT else SOURCE_NORMAL
              actual = path.stat().st_size
              if actual != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} bytes, got {actual}"
                  )

          source_sizes = [p.stat().st_size for p in source_parts]
          if sum(source_sizes) != TOTAL_SIZE:
              raise SystemExit(
                  f"Logical archive is {sum(source_sizes)} bytes, expected {TOTAL_SIZE}"
              )

          starts = []
          running = 0
          for size in source_sizes:
              starts.append(running)
              running += size

          def logical_read(offset: int, size: int) -> bytes:
              if offset < 0 or size < 0 or offset + size > TOTAL_SIZE:
                  raise ValueError(
                      f"Logical read outside archive: offset={offset}, size={size}"
                  )
              if size == 0:
                  return b""

              out = bytearray()
              pos = offset
              remaining = size

              while remaining:
                  part_index = bisect.bisect_right(starts, pos) - 1
                  if part_index < 0 or part_index >= len(source_parts):
                      raise RuntimeError(f"Could not resolve logical offset {pos}")

                  within = pos - starts[part_index]
                  available = source_sizes[part_index] - within
                  take = min(remaining, available)

                  with source_parts[part_index].open("rb") as f:
                      f.seek(within)
                      block = f.read(take)

                  if len(block) != take:
                      raise RuntimeError(
                          f"Short read from {source_parts[part_index]}: "
                          f"wanted {take}, got {len(block)}"
                      )

                  out.extend(block)
                  pos += take
                  remaining -= take

              return bytes(out)

          prefix = logical_read(0, HEADER_PREFIX_SIZE)
          if prefix[:len(MAGIC)] != MAGIC:
              raise SystemExit("Unexpected UnityWebData archive magic")

          header_end = struct.unpack_from("<I", prefix, len(MAGIC))[0]
          if not (HEADER_PREFIX_SIZE <= header_end <= TOTAL_SIZE):
              raise SystemExit(f"Invalid UnityWebData header end: {header_end}")

          header = logical_read(0, header_end)
          entries = []
          pos = HEADER_PREFIX_SIZE

          while pos < header_end:
              if pos + 12 > header_end:
                  raise SystemExit("Truncated UnityWebData entry record")

              offset, size, name_len = struct.unpack_from("<III", header, pos)
              pos += 12

              if name_len > header_end - pos:
                  raise SystemExit("Truncated UnityWebData entry name")

              raw_name = header[pos:pos + name_len]
              pos += name_len
              name = raw_name.decode("utf-8", errors="strict")

              if offset > TOTAL_SIZE or size > TOTAL_SIZE - offset:
                  raise SystemExit(f"Archive entry outside logical data: {name}")

              if size:
                  first_chunk = offset // PHYSICAL_CHUNK + 1
                  last_chunk = (offset + size - 1) // PHYSICAL_CHUNK + 1
                  chunks = list(range(first_chunk, last_chunk + 1))
              else:
                  first_chunk = None
                  last_chunk = None
                  chunks = []

              entries.append({
                  "name": name,
                  "basename": Path(name).name,
                  "offset": offset,
                  "size": size,
                  "firstChunk": first_chunk,
                  "lastChunk": last_chunk,
                  "chunks": chunks,
              })

          if pos != header_end:
              raise SystemExit("UnityWebData header did not end on a record boundary")

          if (TOTAL_SIZE + PHYSICAL_CHUNK - 1) // PHYSICAL_CHUNK != EXPECTED_CHUNKS:
              raise SystemExit("Unexpected 4 MiB physical chunk geometry")

          by_basename = defaultdict(list)
          for e in entries:
              by_basename[e["basename"]].append(e)

          def unique_entry_by_basename(name: str):
              matches = by_basename.get(name, [])
              if len(matches) == 1:
                  return matches[0]
              if len(matches) > 1:
                  raise RuntimeError(
                      f"Ambiguous archive basename {name!r}: "
                      + ", ".join(m["name"] for m in matches)
                  )
              return None

          def extract_entry(entry: dict, destination: Path) -> Path:
              destination.parent.mkdir(parents=True, exist_ok=True)
              with destination.open("wb") as f:
                  remaining = entry["size"]
                  offset = entry["offset"]
                  step = 1024 * 1024
                  while remaining:
                      take = min(step, remaining)
                      f.write(logical_read(offset, take))
                      offset += take
                      remaining -= take
              return destination

          # Exact scene order from THIS build, not a borrowed scene list.
          ggm_entry = unique_entry_by_basename("globalgamemanagers")
          if ggm_entry is None:
              raise SystemExit("globalgamemanagers not found in UnityWebData archive")

          ggm_path = extract_entry(ggm_entry, TMP / "globalgamemanagers")
          ggm_env = UnityPy.load(str(ggm_path))

          build_scene_paths = None
          for obj in ggm_env.objects:
              if obj.type.name == "BuildSettings":
                  data = obj.read()
                  build_scene_paths = list(getattr(data, "scenes", []) or [])
                  break

          if not build_scene_paths:
              raise SystemExit(
                  "UnityPy could not recover BuildSettings.scenes "
                  "from this build's globalgamemanagers"
              )

          def scene_basename(scene_path: str) -> str:
              return Path(scene_path.replace("\\", "/")).stem

          scene_records = []
          scene_name_to_record = {}

          for index, scene_path in enumerate(build_scene_paths):
              scene_name = scene_basename(scene_path)
              level_file = f"level{index}"
              level_entry = unique_entry_by_basename(level_file)

              rec = {
                  "scene": scene_name,
                  "scenePath": scene_path,
                  "levelIndex": index,
                  "levelFile": level_file,
                  "levelPresent": level_entry is not None,
              }
              scene_records.append(rec)
              scene_name_to_record[scene_name] = rec

          # Vanilla physical-room graph from pinned RandomizerMod transition data.
          transitions = json.loads(
              TRANSITIONS_PATH.read_text(encoding="utf-8")
          )
          neighbors = defaultdict(set)
          transition_rows = []
          unknown_sources = set()
          unknown_targets = set()

          for transition_name, data in transitions.items():
              source = data.get("SceneName")
              target_spec = data.get("VanillaTarget")
              if not source or not target_spec:
                  continue

              target = target_spec.split("[", 1)[0]
              if not target:
                  continue

              source_known = source in scene_name_to_record
              target_known = target in scene_name_to_record

              if source_known and target_known:
                  neighbors[source].add(target)
                  transition_rows.append({
                      "transition": transition_name,
                      "sourceScene": source,
                      "targetScene": target,
                      "doorName": data.get("DoorName"),
                      "direction": data.get("Direction"),
                      "sides": data.get("Sides"),
                  })
              else:
                  if not source_known:
                      unknown_sources.add(source)
                  if not target_known:
                      unknown_targets.add(target)

          def matching_direct_entries(level_index: int):
              level = f"level{level_index}"
              shared = f"sharedassets{level_index}.assets"
              matches = []

              for e in entries:
                  base = e["basename"]
                  if (
                      base == level
                      or base.startswith(level + ".")
                      or base == shared
                      or base.startswith(shared + ".")
                  ):
                      matches.append(e)

              seen = set()
              out = []
              for e in sorted(matches, key=lambda x: (x["offset"], x["name"])):
                  if e["name"] in seen:
                      continue
                  seen.add(e["name"])
                  out.append(e)
              return out

          def chunks_for(entry_list):
              result = set()
              for e in entry_list:
                  result.update(e["chunks"])
              return sorted(result)

          def candidate_serialized_entries(level_index: int):
              wanted = [
                  f"level{level_index}",
                  f"sharedassets{level_index}.assets",
              ]
              result = []
              for name in wanted:
                  e = unique_entry_by_basename(name)
                  if e is not None:
                      result.append(e)
              return result

          # UnityPy external-file references. These stay separate from direct chunks:
          # blindly warming whole shared global files could create massive over-fetch.
          external_dump = {}
          external_cache = {}

          def normalize_external_name(value):
              if value is None:
                  return None
              text = str(value).replace("\\", "/").strip()
              if not text:
                  return None
              return Path(text).name

          def inspect_externals(entry: dict):
              key = entry["name"]
              if key in external_cache:
                  return external_cache[key]

              temp_name = re.sub(r"[^A-Za-z0-9_.-]+", "_", entry["basename"])
              path = extract_entry(
                  entry,
                  TMP / "serialized" / f"{entry['offset']}_{temp_name}",
              )
              found = set()
              errors = []

              try:
                  env = UnityPy.load(str(path))
                  file_objects = list(getattr(env, "files", {}).values())
                  for file_obj in file_objects:
                      exts = (
                          getattr(file_obj, "externals", None)
                          or getattr(file_obj, "m_Externals", None)
                          or []
                      )
                      for ext in exts:
                          candidates = [
                              getattr(ext, "path", None),
                              getattr(ext, "name", None),
                              getattr(ext, "file_name", None),
                              getattr(ext, "fileName", None),
                          ]
                          for value in candidates:
                              normalized = normalize_external_name(value)
                              if normalized:
                                  found.add(normalized)
              except Exception as exc:
                  errors.append(f"{type(exc).__name__}: {exc}")

              result = {
                  "externals": sorted(found),
                  "errors": errors,
              }
              external_cache[key] = result
              external_dump[key] = result
              return result

          scene_chunk_data = {}

          for rec in scene_records:
              idx = rec["levelIndex"]
              direct_entries = matching_direct_entries(idx)
              direct_chunks = chunks_for(direct_entries)

              serialized_entries = candidate_serialized_entries(idx)
              external_names = set()
              external_errors = []

              for e in serialized_entries:
                  info = inspect_externals(e)
                  external_names.update(info["externals"])
                  external_errors.extend(
                      [f"{e['basename']}: {msg}" for msg in info["errors"]]
                  )

              resolved_external_entries = []
              unresolved_external_names = []

              for external_name in sorted(external_names):
                  matches = by_basename.get(external_name, [])
                  if len(matches) == 1:
                      resolved_external_entries.append(matches[0])
                  else:
                      unresolved_external_names.append(external_name)

              external_chunks = chunks_for(resolved_external_entries)

              scene_chunk_data[rec["scene"]] = {
                  "levelIndex": idx,
                  "levelFile": rec["levelFile"],
                  "levelPresent": rec["levelPresent"],
                  "directFiles": [e["name"] for e in direct_entries],
                  "directChunks": direct_chunks,
                  "externalFiles": sorted(
                      {e["name"] for e in resolved_external_entries}
                  ),
                  "externalFileChunks": external_chunks,
                  "unresolvedExternalFiles": unresolved_external_names,
                  "externalInspectionErrors": external_errors,
              }

          # Ready-to-review neighbor plan. Only direct scene-file chunks are unioned.
          # We explicitly do not deploy this map tonight.
          preload_scenes = {}

          for scene, rec in scene_chunk_data.items():
              ns = sorted(neighbors.get(scene, set()))
              neighbor_direct = set()

              for neighbor in ns:
                  nrec = scene_chunk_data.get(neighbor)
                  if nrec:
                      neighbor_direct.update(nrec["directChunks"])

              preload_scenes[scene] = {
                  "levelIndex": rec["levelIndex"],
                  "levelFile": rec["levelFile"],
                  "directChunks": rec["directChunks"],
                  "neighbors": ns,
                  "neighborDirectChunks": sorted(neighbor_direct),
              }

          archive_output = {
              "_meta": {
                  "logicalSize": TOTAL_SIZE,
                  "physicalChunkSize": PHYSICAL_CHUNK,
                  "physicalChunkCount": EXPECTED_CHUNKS,
                  "headerBytes": header_end,
                  "entryCount": len(entries),
              },
              "entries": entries,
          }

          scene_map_output = {
              "_meta": {
                  "source": "BuildSettings.scenes from this build's globalgamemanagers",
                  "sceneCount": len(scene_records),
              },
              "scenes": scene_records,
          }

          neighbor_output = {
              "_meta": {
                  "source": (
                      "homothetyhk/RandomizerMod "
                      "commit cad3d5a7b73ed3ddf4af43795b20c23ced14bb4c "
                      "RandomizerMod/Resources/Data/transitions.json"
                  ),
                  "acceptedTransitionCount": len(transition_rows),
                  "warning": (
                      "Randomizer transition data is a strong vanilla room graph "
                      "but is not guaranteed to include every warp, elevator, "
                      "tram, scripted load, or excluded transition."
                  ),
              },
              "neighbors": {
                  scene: sorted(targets)
                  for scene, targets in sorted(neighbors.items())
              },
              "transitions": transition_rows,
              "referenceScenesMissingFromBuild": {
                  "sources": sorted(unknown_sources),
                  "targets": sorted(unknown_targets),
              },
          }

          preload_output = {
              "_meta": {
                  "status": "ANALYSIS_ONLY_DO_NOT_DEPLOY_YET",
                  "physicalChunkSize": PHYSICAL_CHUNK,
                  "physicalChunkCount": EXPECTED_CHUNKS,
                  "ramCacheLimit": 60 * 1024 * 1024,
                  "sceneMapSource": (
                      "exact BuildSettings.scenes from this Hollow Knight build"
                  ),
                  "neighborGraphSource": (
                      "pinned RandomizerMod vanilla transition data"
                  ),
                  "chunkMeaning": (
                      "neighborDirectChunks contains only levelN / "
                      "sharedassetsN.assets family chunks. "
                      "External serialized dependencies are reported separately "
                      "in scene-chunks.json and are not automatically warmed."
                  ),
              },
              "scenes": preload_scenes,
          }

          (OUT / "archive-entries.json").write_text(
              json.dumps(archive_output, indent=2) + "\n",
              encoding="utf-8",
          )
          (OUT / "scene-map.json").write_text(
              json.dumps(scene_map_output, indent=2) + "\n",
              encoding="utf-8",
          )
          (OUT / "room-neighbors.json").write_text(
              json.dumps(neighbor_output, indent=2) + "\n",
              encoding="utf-8",
          )
          (OUT / "scene-chunks.json").write_text(
              json.dumps({
                  "_meta": {
                      "status": "static analysis; not proof of complete runtime dependencies",
                      "physicalChunkSize": PHYSICAL_CHUNK,
                  },
                  "scenes": scene_chunk_data,
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          (OUT / "preload-map.analysis.json").write_text(
              json.dumps(preload_output, indent=2) + "\n",
              encoding="utf-8",
          )
          (OUT / "unitypy-externals.json").write_text(
              json.dumps(external_dump, indent=2) + "\n",
              encoding="utf-8",
          )

          with (OUT / "scene-map.tsv").open(
              "w", encoding="utf-8", newline=""
          ) as f:
              writer = csv.writer(f, delimiter="\t", lineterminator="\n")
              writer.writerow([
                  "scene", "scene_path", "level_file", "level_present"
              ])
              for rec in scene_records:
                  writer.writerow([
                      rec["scene"],
                      rec["scenePath"],
                      rec["levelFile"],
                      "yes" if rec["levelPresent"] else "no",
                  ])

          levels_present = sum(r["levelPresent"] for r in scene_records)
          scenes_with_neighbors = sum(
              1 for scene in scene_name_to_record
              if neighbors.get(scene)
          )
          scenes_with_direct_chunks = sum(
              1 for rec in scene_chunk_data.values()
              if rec["directChunks"]
          )
          external_error_scenes = sum(
              1 for rec in scene_chunk_data.values()
              if rec["externalInspectionErrors"]
          )

          unitypy_version = "unknown"
          try:
              unitypy_version = importlib.metadata.version("UnityPy")
          except Exception:
              pass

          report_lines = [
              "Hollow Knight scene preload static analysis",
              "",
              "PRODUCTION CHANGED: NO",
              "DATA MODE ANALYZED: 4 MiB",
              "LAZYFS RAM CACHE ASSUMED: 60 MiB",
              "",
              "Archive",
              "-------",
              f"Logical bytes: {TOTAL_SIZE}",
              f"UnityWebData header bytes: {header_end}",
              f"Archive entries: {len(entries)}",
              f"Physical 4 MiB chunks: {EXPECTED_CHUNKS}",
              "",
              "Exact build scene map",
              "---------------------",
              f"BuildSettings scenes: {len(scene_records)}",
              f"Scenes with matching levelN file: {levels_present}",
              "Mapping source: THIS BUILD's globalgamemanagers",
              f"UnityPy version: {unitypy_version}",
              "",
              "Vanilla neighbor graph",
              "----------------------",
              (
                  "Accepted transition records whose source+target exist in this build: "
                  f"{len(transition_rows)}"
              ),
              f"Build scenes with at least one mapped neighbor: {scenes_with_neighbors}",
              f"Reference-only source scenes missing from this build: {len(unknown_sources)}",
              f"Reference-only target scenes missing from this build: {len(unknown_targets)}",
              "",
              "Static scene chunk map",
              "----------------------",
              f"Scenes with direct level/sharedassets-family chunks: {scenes_with_direct_chunks}",
              (
                  "Scenes where UnityPy external-file inspection reported an error: "
                  f"{external_error_scenes}"
              ),
              "",
              "IMPORTANT",
              "---------",
              "1. preload-map.analysis.json is ANALYSIS ONLY. It does not modify the game.",
              (
                  "2. neighborDirectChunks covers levelN/sharedassetsN-family files "
                  "for adjacent rooms."
              ),
              (
                  "3. scene-chunks.json separately reports external serialized-file "
                  "references."
              ),
              (
                  "4. Do NOT warm every externalFileChunk blindly. Shared global asset "
                  "files can be large and file-level inclusion can over-fetch."
              ),
              (
                  "5. Randomizer transition data is broad vanilla door/room data, but "
                  "may omit warps, elevators, trams, scripted loads, or deliberately "
                  "excluded transitions."
              ),
              (
                  "6. Runtime logging can later measure residual misses without requiring "
                  "a manual visit to every room; it should validate/refine the static plan."
              ),
              "",
              "Reference transition data:",
              "homothetyhk/RandomizerMod",
              "commit cad3d5a7b73ed3ddf4af43795b20c23ced14bb4c",
              "RandomizerMod/Resources/Data/transitions.json",
              "",
          ]
          report = "\n".join(report_lines)
          (OUT / "analysis-report.txt").write_text(report, encoding="utf-8")

          print(report)
          print("Generated:")
          for p in sorted(OUT.iterdir()):
              print(" ", p, p.stat().st_size, "bytes")
          PY

      - name: Commit analysis outputs
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add hollowknight/build/analysis

          if git diff --cached --quiet; then
            echo "Analysis output is unchanged; nothing to commit."
            exit 0
          fi

          git commit -m "Analyze Hollow Knight scene preload map"
          git -c http.version=HTTP/1.1 push origin HEAD:main

      - name: Final safety check
        shell: bash
        run: |
          set -euo pipefail

          test -f hollowknight/build/analysis/analysis-report.txt
          test -f hollowknight/build/analysis/scene-map.json
          test -f hollowknight/build/analysis/room-neighbors.json
          test -f hollowknight/build/analysis/scene-chunks.json
          test -f hollowknight/build/analysis/preload-map.analysis.json

          grep -q "PRODUCTION CHANGED: NO" \
            hollowknight/build/analysis/analysis-report.txt

          echo "Analysis complete. Production Hollow Knight files were not modified."
