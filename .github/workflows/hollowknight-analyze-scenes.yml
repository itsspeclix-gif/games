name: Analyze Hollow Knight scene preload map

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hollowknight-analyze-scenes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download pinned Hollow Knight reference data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hk-reference

          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/homothetyhk/RandomizerMod/cad3d5a7b73ed3ddf4af43795b20c23ced14bb4c/RandomizerMod/Resources/Data/transitions.json" \
            -o /tmp/hk-reference/transitions.json

          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/windplusflower/hk-api-skill/fdac21584342cdaf04f521aa23b36ac71f7a6eea/scene-index/scene-map.tsv" \
            -o /tmp/hk-reference/scene-map.tsv

      - name: Analyze archive, scene chunks, and vanilla neighbors
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import bisect
          import csv
          import json
          import re
          import shutil
          import struct
          from collections import defaultdict
          from pathlib import Path

          ROOT = Path("hollowknight/build")
          OUT = ROOT / "analysis"
          SCENE_MAP_PATH = Path("/tmp/hk-reference/scene-map.tsv")
          TRANSITIONS_PATH = Path("/tmp/hk-reference/transitions.json")

          SOURCE_COUNT = 42
          SOURCE_NORMAL = 20_866_662
          SOURCE_FINAL = 13_479_747
          TOTAL_SIZE = 869_012_889
          PHYSICAL_CHUNK = 4 * 1024 * 1024
          EXPECTED_CHUNKS = 208

          MAGIC = b"UnityWebData1.0\x00"
          HEADER_PREFIX_SIZE = len(MAGIC) + 4

          if OUT.exists():
              shutil.rmtree(OUT)
          OUT.mkdir(parents=True)

          source_parts = [
              ROOT / f"hk.data.part{i}"
              for i in range(1, SOURCE_COUNT + 1)
          ]

          for i, path in enumerate(source_parts, 1):
              if not path.is_file():
                  raise SystemExit(f"Missing source part: {path}")
              expected = SOURCE_FINAL if i == SOURCE_COUNT else SOURCE_NORMAL
              actual = path.stat().st_size
              if actual != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} bytes, got {actual}"
                  )

          source_sizes = [p.stat().st_size for p in source_parts]
          if sum(source_sizes) != TOTAL_SIZE:
              raise SystemExit(
                  f"Logical archive is {sum(source_sizes)} bytes, expected {TOTAL_SIZE}"
              )

          starts = []
          running = 0
          for size in source_sizes:
              starts.append(running)
              running += size

          def logical_read(offset: int, size: int) -> bytes:
              if offset < 0 or size < 0 or offset + size > TOTAL_SIZE:
                  raise ValueError(
                      f"Logical read outside archive: offset={offset}, size={size}"
                  )
              if size == 0:
                  return b""

              out = bytearray()
              pos = offset
              remaining = size

              while remaining:
                  part_index = bisect.bisect_right(starts, pos) - 1
                  if part_index < 0 or part_index >= len(source_parts):
                      raise RuntimeError(f"Could not resolve logical offset {pos}")

                  within = pos - starts[part_index]
                  available = source_sizes[part_index] - within
                  take = min(remaining, available)

                  with source_parts[part_index].open("rb") as f:
                      f.seek(within)
                      block = f.read(take)

                  if len(block) != take:
                      raise RuntimeError(
                          f"Short read from {source_parts[part_index]}: "
                          f"wanted {take}, got {len(block)}"
                      )

                  out.extend(block)
                  pos += take
                  remaining -= take

              return bytes(out)

          prefix = logical_read(0, HEADER_PREFIX_SIZE)
          if prefix[:len(MAGIC)] != MAGIC:
              raise SystemExit("Unexpected UnityWebData archive magic")

          header_end = struct.unpack_from("<I", prefix, len(MAGIC))[0]
          if not (HEADER_PREFIX_SIZE <= header_end <= TOTAL_SIZE):
              raise SystemExit(f"Invalid UnityWebData header end: {header_end}")

          header = logical_read(0, header_end)
          entries = []
          pos = HEADER_PREFIX_SIZE

          while pos < header_end:
              if pos + 12 > header_end:
                  raise SystemExit("Truncated UnityWebData entry record")

              offset, size, name_len = struct.unpack_from("<III", header, pos)
              pos += 12

              if name_len > header_end - pos:
                  raise SystemExit("Truncated UnityWebData entry name")

              raw_name = header[pos:pos + name_len]
              pos += name_len
              name = raw_name.decode("utf-8", errors="strict")

              if offset > TOTAL_SIZE or size > TOTAL_SIZE - offset:
                  raise SystemExit(f"Archive entry outside logical data: {name}")

              if size:
                  first_chunk = offset // PHYSICAL_CHUNK + 1
                  last_chunk = (offset + size - 1) // PHYSICAL_CHUNK + 1
                  chunks = list(range(first_chunk, last_chunk + 1))
              else:
                  first_chunk = None
                  last_chunk = None
                  chunks = []

              entries.append({
                  "name": name,
                  "basename": Path(name).name,
                  "offset": offset,
                  "size": size,
                  "firstChunk": first_chunk,
                  "lastChunk": last_chunk,
                  "chunks": chunks,
              })

          if pos != header_end:
              raise SystemExit("UnityWebData header did not end on a record boundary")

          if (TOTAL_SIZE + PHYSICAL_CHUNK - 1) // PHYSICAL_CHUNK != EXPECTED_CHUNKS:
              raise SystemExit("Unexpected 4 MiB physical chunk geometry")

          by_basename = defaultdict(list)
          for entry in entries:
              by_basename[entry["basename"]].append(entry)

          def direct_entries_for_level(level_index: int):
              level = f"level{level_index}"
              shared = f"sharedassets{level_index}.assets"
              matches = []
              seen = set()

              for entry in entries:
                  base = entry["basename"]
                  if (
                      base == level
                      or base.startswith(level + ".")
                      or base == shared
                      or base.startswith(shared + ".")
                  ):
                      if entry["name"] not in seen:
                          matches.append(entry)
                          seen.add(entry["name"])

              return sorted(matches, key=lambda e: (e["offset"], e["name"]))

          def chunks_for(entry_list):
              chunks = set()
              for entry in entry_list:
                  chunks.update(entry["chunks"])
              return sorted(chunks)

          scene_records = []
          scene_name_to_record = {}
          level_re = re.compile(r"^level(\d+)$")

          with SCENE_MAP_PATH.open("r", encoding="utf-8", newline="") as f:
              reader = csv.DictReader(f, delimiter="\t")
              required = {"scene", "scene_path", "level_file"}
              if not reader.fieldnames or not required.issubset(reader.fieldnames):
                  raise SystemExit(
                      "Pinned scene-map.tsv is missing required columns: "
                      + ", ".join(sorted(required))
                  )

              for row in reader:
                  scene = (row.get("scene") or "").strip()
                  scene_path = (row.get("scene_path") or "").strip()
                  level_file = (row.get("level_file") or "").strip()
                  match = level_re.fullmatch(level_file)

                  if not scene or not scene_path or not match:
                      raise SystemExit(f"Invalid scene-map row: {row!r}")

                  level_index = int(match.group(1))
                  level_matches = by_basename.get(level_file, [])
                  level_present = len(level_matches) == 1
                  direct_entries = direct_entries_for_level(level_index)

                  record = {
                      "scene": scene,
                      "scenePath": scene_path,
                      "levelIndex": level_index,
                      "levelFile": level_file,
                      "levelPresent": level_present,
                      "directFiles": [e["name"] for e in direct_entries],
                      "directChunks": chunks_for(direct_entries),
                  }

                  if scene in scene_name_to_record:
                      raise SystemExit(f"Duplicate scene in scene map: {scene}")

                  scene_records.append(record)
                  scene_name_to_record[scene] = record

          if not scene_records:
              raise SystemExit("Pinned scene map was empty")

          required_scenes = ["Town", "Crossroads_01", "Crossroads_02"]
          for scene in required_scenes:
              rec = scene_name_to_record.get(scene)
              if rec is None:
                  raise SystemExit(f"Pinned scene map is missing required scene: {scene}")
              if not rec["levelPresent"]:
                  raise SystemExit(
                      f"Archive does not contain expected {rec['levelFile']} for {scene}"
                  )

          levels_present = sum(1 for rec in scene_records if rec["levelPresent"])
          direct_present = sum(1 for rec in scene_records if rec["directChunks"])

          if levels_present < int(len(scene_records) * 0.95):
              raise SystemExit(
                  "Pinned scene map does not sufficiently match this archive: "
                  f"{levels_present}/{len(scene_records)} level files present"
              )

          transitions = json.loads(
              TRANSITIONS_PATH.read_text(encoding="utf-8")
          )
          if not isinstance(transitions, dict):
              raise SystemExit("Pinned transitions.json did not contain an object")

          neighbors = defaultdict(set)
          transition_rows = []
          unknown_sources = set()
          unknown_targets = set()

          for transition_name, data in transitions.items():
              if not isinstance(data, dict):
                  continue

              source = data.get("SceneName")
              target_spec = data.get("VanillaTarget")
              if not source or not target_spec:
                  continue

              target = str(target_spec).split("[", 1)[0]
              if not target:
                  continue

              source_known = source in scene_name_to_record
              target_known = target in scene_name_to_record

              if source_known and target_known:
                  neighbors[source].add(target)
                  transition_rows.append({
                      "transition": transition_name,
                      "sourceScene": source,
                      "targetScene": target,
                      "doorName": data.get("DoorName"),
                      "direction": data.get("Direction"),
                      "sides": data.get("Sides"),
                  })
              else:
                  if not source_known:
                      unknown_sources.add(source)
                  if not target_known:
                      unknown_targets.add(target)

          if len(transition_rows) < 100:
              raise SystemExit(
                  "Too few accepted vanilla transitions: "
                  f"{len(transition_rows)}"
              )

          scenes_output = {}
          for rec in scene_records:
              scene = rec["scene"]
              ns = sorted(neighbors.get(scene, set()))
              neighbor_chunks = set()
              neighbor_detail = {}

              for neighbor in ns:
                  nrec = scene_name_to_record[neighbor]
                  chunks = nrec["directChunks"]
                  neighbor_detail[neighbor] = chunks
                  neighbor_chunks.update(chunks)

              scenes_output[scene] = {
                  "levelIndex": rec["levelIndex"],
                  "levelFile": rec["levelFile"],
                  "levelPresent": rec["levelPresent"],
                  "directFiles": rec["directFiles"],
                  "directChunks": rec["directChunks"],
                  "neighbors": ns,
                  "neighborChunksByScene": neighbor_detail,
                  "neighborDirectChunks": sorted(neighbor_chunks),
              }

          preload_output = {
              "_meta": {
                  "status": "ANALYSIS_ONLY_DO_NOT_DEPLOY_YET",
                  "logicalSize": TOTAL_SIZE,
                  "physicalChunkSize": PHYSICAL_CHUNK,
                  "physicalChunkCount": EXPECTED_CHUNKS,
                  "ramCacheLimit": 60 * 1024 * 1024,
                  "sceneMapSource": (
                      "windplusflower/hk-api-skill commit "
                      "fdac21584342cdaf04f521aa23b36ac71f7a6eea "
                      "scene-index/scene-map.tsv"
                  ),
                  "neighborGraphSource": (
                      "homothetyhk/RandomizerMod commit "
                      "cad3d5a7b73ed3ddf4af43795b20c23ced14bb4c "
                      "RandomizerMod/Resources/Data/transitions.json"
                  ),
                  "chunkMeaning": (
                      "directChunks and neighborDirectChunks cover only "
                      "levelN/sharedassetsN.assets-family archive entries. "
                      "Runtime logging must measure any residual dependency misses."
                  ),
              },
              "scenes": scenes_output,
          }

          archive_output = {
              "_meta": {
                  "logicalSize": TOTAL_SIZE,
                  "physicalChunkSize": PHYSICAL_CHUNK,
                  "physicalChunkCount": EXPECTED_CHUNKS,
                  "headerBytes": header_end,
                  "entryCount": len(entries),
              },
              "entries": entries,
          }

          scene_map_output = {
              "_meta": {
                  "source": (
                      "Pinned hk-api-skill scene map, verified against "
                      "this archive's levelN entries"
                  ),
                  "sceneCount": len(scene_records),
                  "levelsPresent": levels_present,
              },
              "scenes": scene_records,
          }

          neighbor_output = {
              "_meta": {
                  "acceptedTransitionCount": len(transition_rows),
                  "warning": (
                      "Randomizer vanilla transition data may omit some "
                      "warps, elevators, trams, scripted loads, or excluded transitions."
                  ),
              },
              "neighbors": {
                  scene: sorted(targets)
                  for scene, targets in sorted(neighbors.items())
              },
              "transitions": transition_rows,
              "referenceScenesMissingFromBuildMap": {
                  "sources": sorted(unknown_sources),
                  "targets": sorted(unknown_targets),
              },
          }

          (OUT / "archive-entries.json").write_text(
              json.dumps(archive_output, indent=2) + "\n",
              encoding="utf-8",
          )
          (OUT / "scene-map.json").write_text(
              json.dumps(scene_map_output, indent=2) + "\n",
              encoding="utf-8",
          )
          (OUT / "room-neighbors.json").write_text(
              json.dumps(neighbor_output, indent=2) + "\n",
              encoding="utf-8",
          )
          (OUT / "scene-chunks.json").write_text(
              json.dumps({"scenes": scenes_output}, indent=2) + "\n",
              encoding="utf-8",
          )
          (OUT / "preload-map.analysis.json").write_text(
              json.dumps(preload_output, indent=2) + "\n",
              encoding="utf-8",
          )

          report_lines = [
              "Hollow Knight neighbor-room preload static analysis",
              "",
              "PRODUCTION CHANGED: NO",
              "DATA MODE ANALYZED: 4 MiB",
              "LAZYFS RAM CACHE ASSUMED: 60 MiB",
              "",
              f"UnityWebData entries: {len(entries)}",
              f"Scene-map rows: {len(scene_records)}",
              f"Mapped levelN files present: {levels_present}",
              f"Scenes with direct chunks: {direct_present}",
              f"Accepted vanilla transitions: {len(transition_rows)}",
              f"Scenes with at least one neighbor: {sum(bool(v) for v in neighbors.values())}",
              "",
              "Scene map source:",
              "windplusflower/hk-api-skill",
              "commit fdac21584342cdaf04f521aa23b36ac71f7a6eea",
              "scene-index/scene-map.tsv",
              "",
              "Transition source:",
              "homothetyhk/RandomizerMod",
              "commit cad3d5a7b73ed3ddf4af43795b20c23ced14bb4c",
              "RandomizerMod/Resources/Data/transitions.json",
              "",
              "IMPORTANT:",
              "This output is analysis only and does not modify the game loader.",
              "Neighbor chunk sets currently include direct level/sharedassets-family files only.",
              "Runtime miss logging should validate and refine dependency coverage before deployment.",
          ]

          report = "\n".join(report_lines) + "\n"
          (OUT / "analysis-report.txt").write_text(report, encoding="utf-8")
          print(report)

          print("Generated outputs:")
          for path in sorted(OUT.iterdir()):
              print(f"  {path}: {path.stat().st_size} bytes")
          PY

      - name: Commit analysis outputs
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add hollowknight/build/analysis

          if git diff --cached --quiet; then
            echo "Analysis outputs are unchanged."
          else
            git commit -m "Add Hollow Knight neighbor preload analysis"
            git -c http.version=HTTP/1.1 push origin HEAD:main
          fi

      - name: Final safety check
        shell: bash
        run: |
          set -euo pipefail

          test -s hollowknight/build/analysis/scene-map.json
          test -s hollowknight/build/analysis/room-neighbors.json
          test -s hollowknight/build/analysis/scene-chunks.json
          test -s hollowknight/build/analysis/preload-map.analysis.json
          test -s hollowknight/build/analysis/analysis-report.txt

          grep -q 'ANALYSIS_ONLY_DO_NOT_DEPLOY_YET' \
            hollowknight/build/analysis/preload-map.analysis.json

          echo "Hollow Knight neighbor preload analysis complete."
          echo "Production loader was not changed."
