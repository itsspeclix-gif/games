<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hollow</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101018; }
    #game { width: 100%; height: 100%; display: block; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 12px; color: #fff; font: 600 16px system-ui, sans-serif; text-align: center; }
    progress { width: min(320px, 80vw); height: 12px; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="loading">
    <span id="message">Loading game files…</span>
    <progress id="progress" value="0" max="1"></progress>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const loading = document.getElementById('loading');
    const message = document.getElementById('message');
    const progress = document.getElementById('progress');
    const gameBase = 'https://cdn.jsdelivr.net/gh/itsspeclix-gif/games@main/';
    const assetBase = gameBase + 'build/';
    const isIOS =
      /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    function partUrls(prefix, count) {
      return Array.from({ length: count }, (_, index) =>
        `${assetBase}${prefix}.part${index + 1}`
      );
    }

    function loadScript(url) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = url;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Could not load ${url}`));
        document.head.appendChild(script);
      });
    }

    async function joinParts(urls, type, label) {
      const blobs = [];
      for (let index = 0; index < urls.length; index += 1) {
        message.textContent = `Loading ${label} ${index + 1} of ${urls.length}…`;
        const response = await fetch(urls[index]);
        if (!response.ok) throw new Error(`Could not load ${urls[index]} (${response.status})`);
        blobs.push(await response.blob());
      }
      const compositeBlob = new Blob(blobs, { type });
      blobs.length = 0;
      return URL.createObjectURL(compositeBlob);
    }

    function settle(promise) {
      return promise.then(
        value => ({ status: 'fulfilled', value }),
        reason => ({ status: 'rejected', reason })
      );
    }

    let dataUrl = null;
    let codeUrl = null;

    function updateMultipartProgress(update) {
      if (update.phase === 'archive') {
        message.textContent = 'Loading game archive…';
      } else if (update.phase === 'mounting') {
        message.textContent = `Mounting game data: ${update.filesMounted} / ${update.totalFiles} files…`;
      } else if (update.phase === 'complete') {
        message.textContent = 'Starting game…';
      }
    }

    function revokeGameUrls() {
      if (dataUrl) {
        URL.revokeObjectURL(dataUrl);
        dataUrl = null;
      }
      if (codeUrl) {
        URL.revokeObjectURL(codeUrl);
        codeUrl = null;
      }
    }

    async function loadGameFiles() {
      if (isIOS) {
        await loadScript(assetBase + 'hk.multipart-data.js?v=1');
        await loadScript(assetBase + 'hk.loader.js?v=5');
        codeUrl = await joinParts(partUrls('hk.wasm', 2), 'application/wasm', 'runtime');
        return;
      }

      const [loaderResult, dataResult, codeResult] = await Promise.all([
        settle(loadScript(assetBase + 'hk.loader.js?v=5')),
        settle(joinParts(partUrls('hk.data', 42), 'application/octet-stream', 'game data')),
        settle(joinParts(partUrls('hk.wasm', 2), 'application/wasm', 'runtime'))
      ]);

      if (dataResult.status === 'fulfilled') dataUrl = dataResult.value;
      if (codeResult.status === 'fulfilled') codeUrl = codeResult.value;

      const failedResult = [loaderResult, dataResult, codeResult]
        .find(result => result.status === 'rejected');
      if (failedResult) throw failedResult.reason;
    }

    async function startGame() {
      try {
        await loadGameFiles();
        message.textContent = 'Starting game…';
        const unityConfig = {
          frameworkUrl: assetBase + 'hk.framework.js',
          codeUrl,
          streamingAssetsUrl: gameBase + 'StreamingAssets/',
          devicePixelRatio: isIOS ? 1 : window.devicePixelRatio
        };
        if (isIOS) {
          unityConfig.dataPartUrls = partUrls('hk.data', 42);
          unityConfig.mountDataParts = (module, urls) =>
            mountUnityDataParts(module, urls, { onProgress: updateMultipartProgress });
        } else {
          unityConfig.dataUrl = dataUrl;
        }
        await createUnityInstance(canvas, unityConfig, value => { progress.value = value; });
        revokeGameUrls();
        loading.remove();
      } catch (error) {
        revokeGameUrls();
        console.error(error);
        message.textContent = `Unable to start: ${error.message}`;
      }
    }

    startGame();
  </script>
</body>
</html>
